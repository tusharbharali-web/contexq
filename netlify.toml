[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Normalise lowercase ecosystem URLs to the capital-E Next.js route folder.
[[redirects]]
  from = "/ecosystem/*"
  to = "/Ecosystem/:splat"
  status = 301
  force = true

# Optimized for large 3D assets & long-lived sessions
[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true

[build.processing.html]
  pretty_print = true

[build.processing.css]
  bundle = true
  compress = true

[build.processing.js]
  bundle = true
  compress = true
