<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#FFFFFF"/>
  <!-- Elegant Chamber Crest Frame -->
  <rect x="12" y="12" width="176" height="176" rx="14" fill="none" stroke="#8B1D24" stroke-width="2"/>
  <rect x="16" y="16" width="168" height="168" rx="10" fill="none" stroke="#0B1530" stroke-width="0.8" stroke-dasharray="3 2"/>
  <!-- Seal Icon / Lion & Ships Motif representation -->
  <g transform="translate(100, 58)">
    <circle cx="0" cy="0" r="26" fill="#8B1D24"/>
    <!-- Stylized anchor & globe lines -->
    <path d="M-12 0 A12 12 0 0 0 12 0 M0 -14 L0 14 M-6 -8 L6 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Monogram -->
  <text x="100" y="118" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0B1530" text-anchor="middle" letter-spacing="3">SICC</text>
  <!-- Full Name -->
  <text x="100" y="138" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#8B1D24" text-anchor="middle" letter-spacing="1.2">SINGAPORE INTERNATIONAL</text>
  <text x="100" y="150" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#0B1530" text-anchor="middle" letter-spacing="1">CHAMBER OF COMMERCE</text>
  <!-- Foundation year -->
  <text x="100" y="168" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">EST. 1837</text>
</svg>

