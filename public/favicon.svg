<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" fill="#020408" rx="12"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="cqGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- CQ Text -->
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="url(#cqGradient)">CQ</text>

  <!-- Subtle accent circle -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#cqGradient)" stroke-width="1" opacity="0.3"/>
</svg>